name: generate

on:
  schedule:
    # Déclenchement automatique chaque matin à 5h00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet le lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Exécuter le script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python generate_triptych.py

      - name: Enregistrer et publier le triptyque
        run: |
          git config --global user.name "Trivium Bot"
          git config --global user.email "bot@trivium.app"
          git add today.json archive/
          git commit -m "✨ Édition du jour : $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin main
