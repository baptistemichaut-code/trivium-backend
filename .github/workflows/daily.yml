name: Generate Daily Triptych

on:
  schedule:
    # Exécution automatique chaque jour à 04h00 UTC (06h00 heure de Paris)
    - cron: '0 4 * * *'
  workflow_dispatch: # Permet de déclencher l'action manuellement depuis GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit and push daily edition
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git commit -m "Update daily triptych [skip ci]" || exit 0
          git push
