name: Génération Quotidienne Trivium

on:
  schedule:
    # Déclenchement automatique chaque nuit à 04:00 UTC (06:00 heure de Paris)
    - cron: '0 4 * * *'
  # Permet également de lancer la génération manuellement depuis GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution du script de génération
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_triptych.py

      - name: Commit et Push de la nouvelle édition
        run: |
          git config --global user.name 'Trivium Bot'
          git config --global user.email 'bot@trivium.app'
          git add today.json
          git commit -m "✨ Mise à jour de l'édition du $(date +'%Y-%m-%d')" || exit 0
          git push
          python generate_triptych.py

      - name: Synchroniser et publier
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json archive/
          git commit -m "✨ Édition du jour : $(date +'%Y-%m-%d')" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
