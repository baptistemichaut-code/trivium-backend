name: Generate Daily Triptych

on:
  schedule:
    # 02h17 UTC = 04h17 heure de Paris
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run generation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_triptych.py

      - name: Commit and push daily edition
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json archive/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily triptych [skip ci]" && git push)
