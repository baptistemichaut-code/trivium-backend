name: Génération Quotidienne du Triptyque

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exécuter le script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_triptych.py

      - name: Enregistrer et publier le triptyque
        run: |
          git config --global user.name "Trivium Bot"
          git config --global user.email "bot@trivium.app"
          git pull --rebase origin main
          git add today.json archive/
          git diff --quiet && git diff --staged --quiet || (git commit -m "✨ Édition du jour : $(date +'%Y-%m-%d')" && git push origin main)
