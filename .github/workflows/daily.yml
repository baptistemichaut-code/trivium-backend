name: generate

on:
  schedule:
    # Déclenchement automatique chaque jour à 05h00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch: # Déclenchement manuel

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt sur la branche main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests

      - name: Exécuter le script de génération
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python generate_triptych.py

      - name: Publier automatiquement le triptyque
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✨ Édition du jour : Auto-generation"
          file_pattern: "today.json archive/*.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
