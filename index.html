<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivium — Trois œuvres, un fil invisible</title>
  <meta name="description" content="Chaque matin, découvrez un livre, un film et un album reliés par une résonance secrète.">
  
  <!-- Tailwind CSS & Typographie -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #EEE9DF;
      color: #1A1A1E;
    }
    .font-serif {
      font-family: 'Newsreader', Georgia, serif;
    }
    .card-bg {
      background-color: #F8F6F0;
    }
  </style>
</head>
<body class="min-h-screen antialiased flex flex-col justify-between">

  <!-- En-tête / Navigation -->
  <header class="border-b border-[#D8D2C4] px-6 py-4 sticky top-0 bg-[#EEE9DF]/90 backdrop-blur-md z-30">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="flex space-x-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-[#FF9500]"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#007AFF]"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-[#FF2D55]"></span>
        </div>
        <span class="font-serif font-bold text-xl tracking-[0.2em]">TRIVIUM</span>
      </div>
      <a href="#download" class="text-xs font-bold bg-[#7C3AED] hover:bg-[#6D28D9] text-white px-4 py-2 rounded-full transition shadow-sm">
        Télécharger sur iOS
      </a>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-4xl mx-auto px-4 py-8 sm:py-12 w-full flex-grow">
    
    <!-- Sélecteur de Sensibilité Culturelle -->
    <div class="flex justify-center mb-8">
      <div class="inline-flex p-1 bg-[#E2DC CE] rounded-full border border-[#D0C9BA]">
        <button onclick="setTier('accessible')" id="tab-accessible" class="tier-btn px-5 py-2 text-xs font-bold rounded-full bg-[#7C3AED] text-white shadow-sm transition">
          Pop Culture
        </button>
        <button onclick="setTier('intermediate')" id="tab-intermediate" class="tier-btn px-5 py-2 text-xs font-bold rounded-full text-[#6B6559] hover:text-black transition">
          Curieux
        </button>
        <button onclick="setTier('expert')" id="tab-expert" class="tier-btn px-5 py-2 text-xs font-bold rounded-full text-[#6B6559] hover:text-black transition">
          Initié
        </button>
      </div>
    </div>

    <!-- Bannière Thème du Jour -->
    <div id="theme-banner" class="text-center mb-10 card-bg p-8 rounded-3xl border border-[#D8D2C4] shadow-sm relative overflow-hidden">
      <span id="date-label" class="text-[11px] font-bold text-[#8C8474] tracking-widest uppercase block mb-3">Édition du jour</span>
      <h1 id="theme-title" class="font-serif text-3xl sm:text-4xl font-semibold mb-3">Chargement...</h1>
      <p id="theme-subtitle" class="text-sm sm:text-base text-[#6B6559] max-w-xl mx-auto italic font-serif">Trois œuvres reliées par un fil invisible.</p>
    </div>

    <!-- Grille des 3 Œuvres -->
    <div id="items-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
      <!-- Les cartes seront injectées dynamiquement par JavaScript -->
    </div>

  </main>

  <!-- Pied de page -->
  <footer class="border-t border-[#D8D2C4] py-8 text-center text-xs text-[#8C8474] bg-[#E8E2D6]">
    <div class="max-w-4xl mx-auto px-4 space-y-2">
      <div class="flex justify-center space-x-1.5 mb-2">
        <span class="w-2 h-2 rounded-full bg-[#FF9500]"></span>
        <span class="w-2 h-2 rounded-full bg-[#007AFF]"></span>
        <span class="w-2 h-2 rounded-full bg-[#FF2D55]"></span>
      </div>
      <p class="font-serif italic text-sm">« Trois œuvres, un fil invisible. »</p>
      <p>© 2026 Trivium Culture. Tous droits réservés.</p>
    </div>
  </footer>

  <!-- Script de Chargement des Données & Audio -->
  <script>
    let globalData = null;
    let currentTier = 'accessible';
    let currentAudio = null;
    let currentPlayBtn = null;

    const accentMap = {
      'LIVRE': { color: '#FF9500', bg: 'bg-[#FF9500]', border: 'border-[#FF9500]/40' },
      'FILM': { color: '#007AFF', bg: 'bg-[#007AFF]', border: 'border-[#007AFF]/40' },
      'ALBUM': { color: '#FF2D55', bg: 'bg-[#FF2D55]', border: 'border-[#FF2D55]/40' }
    };

    // Chargement direct du fichier JSON
    async function initTrivium() {
      try {
        const response = await fetch('today.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error("Fichier introuvable");
        globalData = await response.json();
        
        // Date locale
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date-label').innerText = new Date().toLocaleDateString('fr-FR', dateOptions);
        
        renderCurrentTier();
      } catch (err) {
        document.getElementById('theme-title').innerText = "Bienvenue sur Trivium";
        document.getElementById('theme-subtitle').innerText = "Revenez dans quelques instants, l'édition est en cours de déploiement.";
      }
    }

    function setTier(tier) {
      currentTier = tier;
      document.querySelectorAll('.tier-btn').forEach(btn => {
        btn.classList.remove('bg-[#7C3AED]', 'text-white', 'shadow-sm');
        btn.classList.add('text-[#6B6559]');
      });
      const activeBtn = document.getElementById('tab-' + tier);
      activeBtn.classList.add('bg-[#7C3AED]', 'text-white', 'shadow-sm');
      activeBtn.classList.remove('text-[#6B6559]');
      renderCurrentTier();
    }

    function renderCurrentTier() {
      if (!globalData || !globalData[currentTier]) return;
      const tierData = globalData[currentTier];

      document.getElementById('theme-title').innerText = tierData.themeTitle;
      document.getElementById('theme-subtitle').innerText = tierData.themeSubtitle;

      const container = document.getElementById('items-container');
      container.innerHTML = '';

      tierData.items.forEach((item, index) => {
        const conf = accentMap[item.type] || { color: '#7C3AED', bg: 'bg-[#7C3AED]', border: 'border-[#7C3AED]' };
        const card = document.createElement('div');
        card.className = `card-bg rounded-2xl p-5 border ${conf.border} flex flex-col justify-between shadow-sm`;

        // Jaquette ou fallback
        let imageHtml = item.imageURL 
          ? `<img src="${item.imageURL}" alt="${item.title}" class="w-24 h-24 sm:w-28 sm:h-28 object-cover rounded-xl shadow-md flex-shrink-0">`
          : `<div class="w-24 h-24 sm:w-28 sm:h-28 ${conf.bg} rounded-xl shadow-md flex items-center justify-center text-white font-bold text-xs flex-shrink-0">${item.type}</div>`;

        // Critiques
        let ratingsHtml = '';
        if (item.ratings && item.ratings.length > 0) {
          ratingsHtml = item.ratings.slice(0, 3).map(r => `
            <span class="inline-block bg-[#EAE4D6] px-2 py-1 rounded text-[10px] font-semibold text-[#5A5447]">
              ${r.source} : <strong style="color: ${conf.color}">${r.score}</strong>
            </span>
          `).join(' ');
        }

        // Lecteur Audio pour les albums
        let audioHtml = '';
        if (item.type === 'ALBUM' && item.tracks && item.tracks.length > 0) {
          const firstTrackWithPreview = item.tracks.find(t => t.previewURL);
          if (firstTrackWithPreview) {
            audioHtml = `
              <div class="mt-4 pt-3 border-t border-[#E2DC CE] flex items-center justify-between">
                <span class="text-xs font-medium text-[#6B6559] truncate pr-2">🎵 ${firstTrackWithPreview.title}</span>
                <button onclick="toggleAudio('${firstTrackWithPreview.previewURL}', this)" class="w-8 h-8 rounded-full bg-[#FF2D55] text-white flex items-center justify-center flex-shrink-0 shadow-sm text-xs font-bold hover:scale-105 transition">
                  ▶
                </button>
              </div>
            `;
          }
        }

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="${conf.bg} text-white text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full tracking-wider">
                ${item.type}
              </span>
              <span class="text-[11px] font-semibold text-[#8C8474]">${item.year}</span>
            </div>

            <div class="flex space-x-4 mb-4 items-center">
              ${imageHtml}
              <div>
                <span class="text-[10px] font-bold uppercase tracking-wider block mb-1" style="color: ${conf.color}">${item.genre}</span>
                <h2 class="font-serif font-bold text-lg leading-snug line-clamp-2">${item.title}</h2>
                <p class="text-xs text-[#6B6559] mt-0.5">${item.creator}</p>
                <p class="text-[10px] text-[#8C8474] mt-1">${item.origin} • ${item.formatMetric}</p>
              </div>
            </div>

            ${item.quote ? `<p class="font-serif italic text-xs text-[#4A453B] bg-[#EAE4D6]/70 p-2.5 rounded-lg border-l-2 mb-3" style="border-color: ${conf.color}">« ${item.quote} »</p>` : ''}

            <p class="text-xs text-[#5A5447] leading-relaxed line-clamp-3 mb-4">${item.aiSummary}</p>
          </div>

          <div>
            <div class="flex flex-wrap gap-1 mb-2">
              ${ratingsHtml}
            </div>
            ${audioHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAudio(url, btn) {
      if (currentAudio && currentAudio.src === url) {
        if (currentAudio.paused) {
          currentAudio.play();
          btn.innerText = '⏸';
        } else {
          currentAudio.pause();
          btn.innerText = '▶';
        }
        return;
      }

      if (currentAudio) {
        currentAudio.pause();
        if (currentPlayBtn) currentPlayBtn.innerText = '▶';
      }

      currentAudio = new Audio(url);
      currentPlayBtn = btn;
      btn.innerText = '⏸';
      currentAudio.play();

      currentAudio.onended = () => {
        btn.innerText = '▶';
      };
    }

    window.onload = initTrivium;
  </script>
</body>
</html>
